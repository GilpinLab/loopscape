[project]
name = "loopscape"
version = "0.1.0"
description = "Solver wrappers, latent-slice utilities, and basin metrics for looped reasoning models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8",
    "numpy>=1.26",
    "omegaconf>=2.3",     # EqR checkpoints embed an OmegaConf config (torch.load)
    "pydantic>=2",        # TRM vendored arch config
    "pyyaml>=6",
    "requests>=2.31",
    "scipy>=1.11",        # metrics (KDTree, convolve)
    "torch>=2.1",
]

[project.optional-dependencies]
# The recurrent language models (huginn, hrm-text) and the Parcae probe.
lm = ["transformers>=5.9"]
demos = ["matplotlib>=3.8", "jupyter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loopscape"]
